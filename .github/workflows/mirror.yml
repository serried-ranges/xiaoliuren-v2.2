name: 镜像同步到 AtomGit & Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mirror:
    name: 同步代码镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整历史（含所有分支与标签）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 SSH 私钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}

      - name: 写入 known_hosts（AtomGit / Gitee）
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ed25519 atomgit.com >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -t rsa,ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: 推送镜像到 AtomGit
        run: |
          git remote add atomgit git@atomgit.com:serried-ranges/xiaoliuren-v2.2.git
          git push --prune --force atomgit 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

      - name: 推送镜像到 Gitee
        run: |
          git remote add gitee git@gitee.com:serried-ranges/xiaoliuren-v2.2.git
          git push --prune --force gitee 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

      - name: 完成通知
        run: |
          echo "✅ 镜像已同步到 AtomGit 和 Gitee"
          echo "当前主仓库 main: $(git rev-parse origin/main)"
