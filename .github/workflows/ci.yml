name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  v22:
    name: V2.2 兼容基线检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm run test:all
      - run: npm run build
      - run: npm run build:protected
      - run: npm run test:protected
