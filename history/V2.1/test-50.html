<script>
// ===== 独立排盘实现（与 V2.1.1 完全一致）=====
const SHEN_NAMES = ['大安','留连','速喜','赤口','小吉','空亡'];
const SHEN_MEANING = {'大安':'平安吉祥，诸事顺利','留连':'事有拖延，需耐心等待','速喜':'喜事临门，快速达成','赤口':'口舌是非，谨慎行事','小吉':'小有吉利，渐进成功','空亡':'事多落空，需防损失'};
const LIU_SHEN_NAMES = ['青龙','朱雀','勾陈','白虎','玄武','螣蛇'];
const LIU_XING_NAMES = ['木','火','土','金','水','天'];
const DZ_WUXING = {'子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'};
const YANG_DZ = ['子','寅','辰','午','申','戌'];
const YIN_DZ = ['丑','卯','巳','未','酉','亥'];
const ALL_DZ = '子丑寅卯辰巳午未申酉戌亥';

function getRemainder(num){ return Math.floor(Math.abs(num))%6; }
function walk(start, r){ const off = r===0?5:(r-1)%6; return (start+off)%6; }
function calculate(n1,n2,n3){
  const r1=getRemainder(n1),r2=getRemainder(n2),r3=getRemainder(n3);
  const i1=walk(0,r1),i2=walk(i1,r2),i3=walk(i2,r3);
  return {idx:[i1,i2,i3], names:[SHEN_NAMES[i1],SHEN_NAMES[i2],SHEN_NAMES[i3]], final:SHEN_NAMES[i3], remainders:[r1,r2,r3]};
}
function getShiChen(h){ const sc=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥']; return sc[Math.floor((h+1)/2)%12]; }

function solarToLunar(y,m,d){
  const L = Solar.fromYmd(y,m,d).getLunar();
  const lm = L.getMonth();
  return {
    ly: L.getYear(),
    lm: Math.abs(lm),
    ld: L.getDay(),
    leap: lm < 0,
    gz: L.getYearInGanZhi(),
    chinese: L.getYearInGanZhi()+'年'+L.getMonthInChinese()+'月'+L.getDayInChinese()
  };
}

function generateJiangPai(names, shiChenDz){
  const renGongName = names[2];
  const isYang = YANG_DZ.includes(shiChenDz);
  const dzList = isYang ? YANG_DZ : YIN_DZ;
  let startIdx = dzList.indexOf(shiChenDz);
  if(startIdx===-1) startIdx=0;
  let diZhiMap={};
  for(let i=0;i<6;i++){ diZhiMap[SHEN_NAMES[i]] = dzList[(startIdx+i)%6]; }
  const selfDz = diZhiMap[renGongName];
  const selfWx = DZ_WUXING[selfDz]||'';
  const sheng={'木':'火','火':'土','土':'金','金':'水','水':'木'};
  const ke={'木':'土','土':'水','水':'火','火':'金','金':'木'};
  let qinMap={};
  for(let sn of SHEN_NAMES){
    if(sn===renGongName){ qinMap[sn]='自身'; continue; }
    let wx = DZ_WUXING[diZhiMap[sn]]||'';
    if(!selfWx||!wx){ qinMap[sn]=''; continue; }
    if(selfWx===wx) qinMap[sn]='兄弟';
    else if(sheng[selfWx]===wx) qinMap[sn]='子孙';
    else if(sheng[wx]===selfWx) qinMap[sn]='父母';
    else if(ke[selfWx]===wx) qinMap[sn]='妻财';
    else if(ke[wx]===selfWx) qinMap[sn]='官鬼';
    else qinMap[sn]='';
  }
  let result=[];
  for(let i=0;i<6;i++){
    let sn=SHEN_NAMES[i];
    result.push({gong:sn, dz:diZhiMap[sn], qin:qinMap[sn], shen:LIU_SHEN_NAMES[i], xing:LIU_XING_NAMES[i]});
  }
  return {rows:result, selfDz:selfDz, selfWx:selfWx};
}

// 模拟古法提示词
function buildGuFaPrompt(calc, lunar, sc, question, ts, method){
  const methodMap={'manual':'✏️ 手动输入','time':'🕒 时间起卦','random':'🎲 随机起卦'};
  return `【小六壬 · 古法排盘】AI解析请求\n═══════════════════════════════════════\n\n您好！以下是小六壬古法排盘的完整信息，请您根据这些信息进行分析与解读。\n\n📅 起卦时间：${ts}\n📝 问念：${question||'（未填写）'}\n🔢 三宫：${calc.names.join(' → ')}\n🎯 落点：${calc.final}（${SHEN_MEANING[calc.final]}）\n🛠 起卦方式：${methodMap[method]||'✏️ 手动输入'}\n\n请结合以上信息，从三宫落点、神煞含义等角度给出详细的解读与建议。谢谢！`;
}
// 模拟江氏提示词
function buildJiangPrompt(calc, lunar, sc, jp, question, ts, method){
  const methodMap={'manual':'✏️ 手动输入','time':'🕒 时间起卦','random':'🎲 随机起卦'};
  const table = jp.rows.map(r=>`${r.gong}(${r.dz}) 亲:${r.qin||'—'} 神:${r.shen} 星:${r.xing}`).join('\n');
  return `【小六壬 · 江氏排盘】AI解析请求\n═══════════════════════════════════════\n\n您好！以下是小六壬江氏排盘的完整信息，请您根据这些信息进行分析与解读。\n\n📅 起卦时间：${ts}\n📅 农历日期：${lunar.chinese}\n⏰ 当前时辰：${sc}时\n📝 问念：${question||'（未填写）'}\n🔢 三宫：${calc.names.join(' → ')}\n🎯 落点：${calc.final}（${SHEN_MEANING[calc.final]}）\n🛠 起卦方式：${methodMap[method]||'✏️ 手动输入'}\n\n【排盘表格】\n${table}\n\n请结合以上信息，从六亲、六神、六星等角度给出详细的解读与建议。谢谢！`;
}

// ===== 运行测试 =====
function run(){
  const results = [];
  let passCnt = 0;
  const checkNames = ['余数范围','三宫有效','落点=人宫','时辰有效','农历有效','六神映射','六星映射','六亲含自身','地支有效','古法提示词','江氏提示词'];

  testData.forEach((t,i)=>{
    const calc = calculate(t.n1,t.n2,t.n3);
    const lunar = solarToLunar(t.y,t.m,t.d);
    const sc = getShiChen(t.h);
    const jp = generateJiangPai(calc.names, sc);
    const ts = `${t.y}-${String(t.m).padStart(2,'0')}-${String(t.d).padStart(2,'0')} ${String(t.h).padStart(2,'0')}:00:00`;
    const guFa = buildGuFaPrompt(calc, lunar, sc, t.q, ts, t.method);
    const jiangP = buildJiangPrompt(calc, lunar, sc, jp, t.q, ts, t.method);

    const checks = {};
    checks['余数范围'] = calc.remainders.every(r=>r>=0 && r<6);
    checks['三宫有效'] = calc.names.every(n=>SHEN_NAMES.includes(n));
    checks['落点=人宫'] = calc.final === calc.names[2];
    checks['时辰有效'] = ALL_DZ.includes(sc);
    checks['农历有效'] = lunar.ly > 1900 && lunar.lm >= 1 && lunar.ld >= 1 && lunar.ld <= 30;
    checks['六神映射'] = jp.rows.every(r=>LIU_SHEN_NAMES.includes(r.shen));
    checks['六星映射'] = jp.rows.every(r=>LIU_XING_NAMES.includes(r.xing));
    checks['六亲含自身'] = jp.rows.some(r=>r.qin==='自身');
    checks['地支有效'] = jp.rows.every(r=>ALL_DZ.includes(r.dz));
    checks['古法提示词'] = guFa.includes('古法排盘') && guFa.includes('三宫') && guFa.includes('落点') && guFa.includes('起卦时间');
    checks['江氏提示词'] = jiangP.includes('江氏排盘') && jiangP.includes('农历日期') && jiangP.includes('当前时辰') && jiangP.includes('排盘表格') && jiangP.includes(lunar.chinese);

    const allPass = Object.values(checks).every(v=>v);
    if(allPass) passCnt++;
    results.push({i:i+1, t, calc, lunar, sc, jp, guFa, jiangP, checks, allPass});
  });

  renderSummary(passCnt, testData.length, results);
  renderDetail(results, checkNames);
}

function renderSummary(pass, total, results){
  const fail = total - pass;
  const rate = (pass/total*100).toFixed(1);
  // 统计农历年份分布
  const years = [...new Set(results.map(r=>r.lunar.gz))];
  // 统计时辰覆盖
  const scs = [...new Set(results.map(r=>r.sc))];
  // 统计落点分布
  const finals = {};
  results.forEach(r=>{ finals[r.calc.final]=(finals[r.calc.final]||0)+1; });
  // 统计闰月
  const leaps = results.filter(r=>r.lunar.leap);

  document.getElementById('summary').innerHTML = `
    <h2>📊 测试统计</h2>
    <div class="summary">
      <span class="stat">测试总数：<b>${total}</b> 组</span>
      <span class="stat">通过：<span class="pass">${pass}</span></span>
      <span class="stat">失败：<span class="${fail>0?'fail':'pass'}">${fail}</span></span>
      <span class="stat">通过率：<b>${rate}%</b></span>
    </div>
    <div class="summary">
      <span class="stat">覆盖农历干支年：<b>${years.length}</b> 种 (${years.join('、')})</span>
      <span class="stat">覆盖时辰：<b>${scs.length}/12</b></span>
      <span class="stat">含闰月样本：<b>${leaps.length}</b> 组</span>
    </div>
    <div class="summary">
      <b>落点分布：</b>
      ${SHEN_NAMES.map(s=>`${s}:${finals[s]||0}`).join(' ｜ ')}
    </div>
  `;
}

function renderDetail(results, checkNames){
  let html = `<h2>📋 详细测试结果（50组）</h2>`;
  html += `<table><thead><tr>
    <th>#</th><th>输入(三数)</th><th>公历</th><th>时辰</th>
    <th>余数</th><th>三宫</th><th>落点</th>
    <th>农历(干支年月日)</th><th>江氏:自身宫/六亲</th>
    <th>验证项</th><th>说明</th>
  </tr></thead><tbody>`;
  results.forEach(r=>{
    const selfRow = r.jp.rows.find(x=>x.qin==='自身');
    const qinStr = r.jp.rows.map(x=>x.qin||'—').join('/');
    const checkStr = checkNames.map(n=>`<span class="${r.checks[n]?'ok':'ng'}">${r.checks[n]?'✓':'✗'}${n}</span>`).join(' ');
    html += `<tr>
      <td>${r.i}</td>
      <td>${r.t.n1},${r.t.n2},${r.t.n3}</td>
      <td>${r.t.y}-${String(r.t.m).padStart(2,'0')}-${String(r.t.d).padStart(2,'0')} ${String(r.t.h).padStart(2,'0')}时</td>
      <td>${r.sc}时</td>
      <td>${r.calc.remainders.join(',')}</td>
      <td>${r.calc.names.join('→')}</td>
      <td><b>${r.calc.final}</b></td>
      <td>${r.lunar.chinese}</td>
      <td>${selfRow?selfRow.gong+'('+selfRow.dz+')':'—'}<br><small>${qinStr}</small></td>
      <td style="font-size:9px;text-align:left;">${checkStr}</td>
      <td style="font-size:10px;">${r.t.desc}</td>
    </tr>`;
  });
  html += `</tbody></table>`;

  // 抽样展示3组完整提示词
  html += `<h2>📝 提示词抽样（第1/9/49组）</h2>`;
  [results[0], results[8], results[48]].forEach((r,idx)=>{
    html += `<div class="summary"><h3>第${r.i}组 ${r.t.desc}</h3>`;
    html += `<span class="tag tag-g">古法提示词（${r.guFa.length}字符）</span><pre style="white-space:pre-wrap;background:#fffdf6;padding:10px;border:1px solid #e0d4b8;border-radius:6px;font-size:11px;margin:6px 0;">${r.guFa}</pre>`;
    html += `<span class="tag tag-j">江氏提示词（${r.jiangP.length}字符）</span><pre style="white-space:pre-wrap;background:#fffdf6;padding:10px;border:1px solid #e0d4b8;border-radius:6px;font-size:11px;margin:6px 0;">${r.jiangP}</pre>`;
    html += `</div>`;
  });

  document.getElementById('detail').innerHTML = html;
}

run();
</script>
</body>
</html>
